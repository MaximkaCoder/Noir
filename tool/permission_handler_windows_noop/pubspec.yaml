name: permission_handler_windows
description: >-
  Stand-in for permission_handler_windows without native code. The real
  plugin subscribes to Windows location updates when the app starts, which
  keeps the "location in use" indicator on. NOIR asks for permissions on
  Android only.
version: 0.2.2
publish_to: none

environment:
  sdk: ^3.6.0

flutter:
  plugin:
    implements: permission_handler
    platforms:
      windows:
        dartPluginClass: PermissionHandlerWindows
