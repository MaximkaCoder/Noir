name: noir
description: "NOIR — less interface, more music."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audio_metadata_reader: ^1.8.1
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  collection: ^1.19.1
  crypto: ^3.0.7
  dio: ^5.11.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  ffi: ^2.2.0
  fftea: ^1.5.0+1
  file_picker: ^13.2.0
  flutter:
    sdk: flutter
  flutter_custom_tabs: ^2.6.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  json_annotation: ^4.12.0
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  path_provider_platform_interface: ^2.1.2
  permission_handler: ^13.0.2
  url_launcher: ^6.3.3
  webview_windows: ^0.4.0
  window_manager: ^0.5.2

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

dependency_overrides:
  # The real plugin keeps Windows location in use; see the stub's pubspec.
  permission_handler_windows:
    path: tool/permission_handler_windows_noop

flutter:
  uses-material-design: true
  shaders:
    - shaders/liquid_glass.frag
  assets:
    - assets/fonts/Inter-LICENSE.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
